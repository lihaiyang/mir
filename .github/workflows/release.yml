name: Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach artifacts to (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'
  push:
    tags:
      - 'v*'
      - 'dev-*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      # No electron-rebuild step: node-pty ships a pure Node-API (N-API) addon,
      # whose ABI is stable across Node/Electron versions — the same pty.node
      # loads under both Node 22 and Electron's bundled Node. electron-builder
      # already has npmRebuild:false, so the native binary is used as-is.
      # The npm tarball's spawn-helper has no exec bit though, which is what
      # scripts/after-pack.js restores.
      - name: Build & package
        run: npm run build && npx electron-builder --mac --arm64 --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Both checks guard failures that are invisible until runtime, and that
      # have already shipped once each:
      #   * stable naming in a dev build would install over the user's MIR.app
      #   * a non-executable spawn-helper breaks every terminal
      - name: Verify package
        run: |
          set -euo pipefail
          zip=$(ls release/MIR-Dev-*.zip)
          echo "artifact: $zip"

          helpers=$(unzip -Z "$zip" | grep 'node-pty.*spawn-helper' || true)
          if [ -z "$helpers" ]; then
            echo "::error::no node-pty spawn-helper in $zip"
            exit 1
          fi
          echo "$helpers"
          if echo "$helpers" | grep -qv '^-rwx'; then
            echo "::error::spawn-helper is not executable inside the zip — every pty:create would fail with 'posix_spawnp failed'"
            exit 1
          fi
          echo "package verified"

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # Both stable (v*) and dev (dev-*) releases are non-prerelease.
          # Channel isolation is handled by the updater, which filters the
          # atom feed by tag prefix (v* for stable, dev-* for dev).
          # Prerelease flag is NOT used because releases.atom excludes
          # prereleases, and we need both channels visible in the feed.
          gh release create "$TAG" --generate-notes --target "$GITHUB_SHA" 2>/dev/null || true
          gh release upload "$TAG" release/*.dmg release/*-mac.zip release/*-mac.zip.blockmap --clobber
